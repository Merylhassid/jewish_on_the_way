name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    env:
      NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package production release
        run: |
          tar -czf /tmp/jotw-backend-ci-release.tar.gz \
            dist package.json package-lock.json ecosystem.config.cjs

      - name: Configure Netcup deployment key
        if: env.NETCUP_SSH_PRIVATE_KEY != ''
        run: |
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          install -d -m 700 ~/.ssh
          ssh-keyscan -t ed25519 159.195.212.37 > ~/.ssh/known_hosts.scan
          ssh-keygen -lf ~/.ssh/known_hosts.scan -E sha256 | \
            grep -F 'SHA256:otm/tj2Ffj5BzPWFzjNbXpoFf0RLov6j33l5eKOtmwM'
          mv ~/.ssh/known_hosts.scan ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend to Netcup
        if: env.NETCUP_SSH_PRIVATE_KEY != ''
        run: |
          scp -i /tmp/deploy_key /tmp/jotw-backend-ci-release.tar.gz \
            jotw@159.195.212.37:/tmp/jotw-backend-ci-release.tar.gz
          scp -i /tmp/deploy_key ../scripts/server/deploy-backend-ci-netcup.sh \
            jotw@159.195.212.37:/tmp/deploy-backend-ci-netcup.sh
          ssh -i /tmp/deploy_key jotw@159.195.212.37 \
            "chmod 700 /tmp/deploy-backend-ci-netcup.sh && \
             /tmp/deploy-backend-ci-netcup.sh && \
             rm -f /tmp/deploy-backend-ci-netcup.sh"
          rm -f /tmp/deploy_key

      - name: Deployment is not configured yet
        if: env.NETCUP_SSH_PRIVATE_KEY == ''
        run: echo "Tests and build passed; add NETCUP_SSH_PRIVATE_KEY to enable Netcup deployment."
