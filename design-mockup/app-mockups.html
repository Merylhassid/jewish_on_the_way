<!DOCTYPE html>
<!--
  Jewish On The Way — FULL APP DESIGN MOCKUP (multi-screen)
  Standalone visual prototype. Does NOT touch real app code.
  Colors 1:1 from mobile/constants/theme.ts.
  Use the top buttons to switch screens. Open in VSCode "Live Preview" side-by-side.
-->
<html lang="he">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<title>Jewish On The Way — App Mockups</title>
<style>
  :root{
    --navy:#0B1736; --navyLight:#1A2D5A; --gold:#D4AF37; --goldFaint:rgba(212,175,55,0.10);
    --bg:#F7F5F0; --card:#FFFFFF;
    --textPrimary:#111827; --textSecondary:#6B7280; --textMuted:#9CA3AF;
    --meat:#DC2626; --dairy:#2563EB; --parve:#059669;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:var(--sans);background:#161618;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 12px;}
  .switcher{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px;}
  .switcher button{font-family:var(--sans);font-size:13px;font-weight:600;color:#cfcfd2;
    background:#2a2a2e;border:1px solid #3a3a3e;border-radius:999px;padding:8px 14px;cursor:pointer;}
  .switcher button.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;
    position:relative;box-shadow:0 30px 80px rgba(0,0,0,.55);border:10px solid #0a0a0c;display:flex;flex-direction:column;}
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;}
  .screen::-webkit-scrollbar{width:0;}
  svg{display:block;flex:0 0 auto;}
  #tabbar{height:64px;background:#fff;border-top:1px solid #F0EDE6;box-shadow:0 -4px 12px rgba(0,0,0,.05);flex:0 0 auto;}

  /* shared header */
  .hdr{background:var(--navy);padding:54px 20px 16px;display:flex;flex-direction:column;gap:14px;}
  .hdrRow{display:flex;align-items:center;gap:14px;}
  .backBtn{width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .hTitle{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px;}
  .hSub{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;font-weight:500;}
  .searchBar{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 14px;border:1px solid rgba(212,175,55,.38);background:rgba(201,168,76,.08);}
  .searchBar .ph{flex:1;font-size:14px;color:rgba(255,255,255,.45);}
  .aiPill{padding:5px 10px;border-radius:10px;background:var(--gold);font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.5px;}

  /* cards / lists */
  .list{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .card{display:flex;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.07);}
  .accent{width:4px;flex:0 0 auto;}
  .cBody{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .cTop{display:flex;align-items:center;gap:12px;}
  .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .cName{font-size:15px;font-weight:700;color:var(--textPrimary);}
  .cType{font-size:12px;font-weight:600;margin-top:1px;}
  .badge{padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;flex:0 0 auto;}
  .meta{display:flex;flex-direction:column;gap:5px;}
  .mRow{display:flex;align-items:center;gap:6px;}
  .mTxt{font-size:12px;color:var(--textMuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cBot{display:flex;align-items:center;}
  .dist{display:flex;align-items:center;gap:4px;background:var(--goldFaint);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--gold);}
  .sp{flex:1;}
  .filters{background:#fff;border-bottom:1px solid #F0EDE6;}
  .fRow{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;}
  .fRow::-webkit-scrollbar{display:none;}
  .chip{padding:7px 14px;border-radius:20px;border:1.5px solid #E5E7EB;background:#fff;font-size:13px;font-weight:600;color:var(--textSecondary);white-space:nowrap;}
  .chip.on{border-color:var(--navy);background:var(--navy);color:#fff;}

  /* sections */
  .secTitle{font-size:16px;font-weight:800;color:var(--textPrimary);padding:18px 16px 8px;}

  /* login */
  .login{flex:1;background:var(--navy);display:flex;flex-direction:column;justify-content:center;padding:32px 26px;gap:18px;}
  .logoWrap{align-items:center;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .logoBadge{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,var(--gold),#b9942f);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(212,175,55,.35);}
  .brand{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.3px;}
  .brandSub{font-size:13px;color:rgba(255,255,255,.55);text-align:center;}
  .field{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .field .ph{font-size:14px;color:rgba(255,255,255,.45);}
  .btnGold{background:var(--gold);border-radius:14px;padding:15px;text-align:center;font-size:15px;font-weight:800;color:var(--navy);margin-top:4px;}
  .linkRow{text-align:center;font-size:13px;color:rgba(255,255,255,.55);}
  .linkRow b{color:var(--gold);font-weight:700;}

  /* home */
  .hero{height:170px;position:relative;}
  .hero img{width:100%;height:100%;object-fit:cover;}
  .heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,23,54,.15),rgba(11,23,54,.85));}
  .heroTxt{position:absolute;left:20px;bottom:16px;right:20px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 20px;}
  .cityCard{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);}
  .cityCard img{width:100%;height:96px;object-fit:cover;display:block;}
  .cityCard .cc{padding:10px 12px;}
  .cityCard .cn{font-size:14px;font-weight:700;color:var(--textPrimary);}
  .cityCard .ck{font-size:12px;color:var(--textMuted);margin-top:1px;}

  /* destination services */
  .svc{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 10px rgba(0,0,0,.07);}
  .svcIco{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .svcName{font-size:16px;font-weight:700;color:var(--textPrimary);}
  .svcCount{font-size:12px;color:var(--textMuted);margin-top:2px;}

  /* detail */
  .detailHero{height:150px;background:var(--navy);position:relative;}
  .detailBody{padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
  .dName{font-size:22px;font-weight:800;color:var(--textPrimary);letter-spacing:-.3px;}
  .badgeRow{display:flex;gap:8px;flex-wrap:wrap;}
  .infoRow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #F0EDE6;}
  .infoTxt{font-size:14px;color:var(--textPrimary);}
  .actions{display:flex;gap:10px;margin-top:6px;}
  .actBtn{flex:1;border-radius:14px;padding:13px;text-align:center;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;}
  .actNavy{background:var(--navy);color:#fff;}
  .actGhost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .desc{font-size:14px;line-height:1.6;color:var(--textSecondary);}
</style>
</head>
<body>
  <div class="switcher" id="switcher"></div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px">
    <span style="color:#8a8a8e;font-size:12px">פונט:</span>
    <div class="switcher" id="fontSwitcher" style="gap:6px"></div>
  </div>
  <style id="fontOverride"></style>
  <div class="phone"><div class="screen" id="screen"></div><div id="tabbar"></div></div>

<script>
/* ───────── icons ───────── */
const I = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
  spark:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
  utensils:(c)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 2 2 2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>`,
  syn:(c)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M12 3v6"/><path d="M9 9h6"/></svg>`,
  pray:(c)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7H6l6 10 6-10h-3V5a3 3 0 0 0-3-3z"/></svg>`,
  home:(c)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21V12h6v9"/></svg>`,
  map:(c)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>`,
  chat:(c)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg>`,
  pin:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  pinG:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  clock:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  phone:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  nav:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
  navW:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
  heart:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B1736" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.5 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  chevG:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  star:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#D4AF37" stroke="#D4AF37" stroke-width="1"><polygon points="12 2 15 9 22 9.3 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.3 9 9"/></svg>',
};
const hex=(h,a)=>{const n=h.replace('#','');return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})`;};
const TYPE={meat:{c:'#DC2626',l:'בשרי'},dairy:{c:'#2563EB',l:'חלבי'},parve:{c:'#059669',l:'פרווה'}};
const KASH={rabbinate:{l:'רבנות',c:'#6B7280',bg:'#F3F4F6'},mehadrin:{l:'מהדרין',c:'#2563EB',bg:'#EFF6FF'},badatz:{l:'בד"ץ',c:'#059669',bg:'#F0FDF4'}};
const IMG=u=>`https://images.unsplash.com/photo-${u}?auto=format&fit=crop&w=900&q=80`;

const RESTOS=[
  {name:'פיצה שמיים',type:'dairy',k:'mehadrin',addr:'חיים עוזר 12, פתח תקווה',hours:'11:00–23:00',dist:'400 m'},
  {name:'שיפודי הבירה',type:'meat',k:'rabbinate',addr:'מוטה גור 8, פתח תקווה',hours:'12:00–24:00',dist:'0.9 km'},
  {name:'פלאפל הזהב',type:'parve',k:'badatz',addr:'ז\'בוטינסקי 45, פתח תקווה',hours:'09:00–22:00',dist:'1.2 km'},
  {name:'קפה ארומה',type:'dairy',k:'rabbinate',addr:'רוטשילד 30, פתח תקווה',hours:'07:00–22:00',dist:'1.6 km'},
  {name:'גריל בר אנגוס',type:'meat',k:'mehadrin',addr:'העצמאות 5, פתח תקווה',hours:'12:00–23:30',dist:'2.1 km'},
];
const DENOM2={ashkenaz:{l:'Ashkenaz',c:'#3B4FC8',bg:'#EEF2FF'},sfarad:{l:'Sfarad',c:'#0F766E',bg:'#F0FDFA'},chabad:{l:'Chabad',c:'#C2410C',bg:'#FFF7ED'},teimanim:{l:'Teimanim',c:'#15803D',bg:'#F0FDF4'}};
const SYNS=[
  {name:'בית הכנסת הגדול',k:'ashkenaz',addr:'הרב קוק 3, ירושלים',dist:'350 m',phone:true},
  {name:'אהל יעקב',k:'sfarad',addr:'מוהליבר 14, ירושלים',dist:'700 m',phone:true},
  {name:'חב"ד מרכז',k:'chabad',addr:'חובבי ציון 21, ירושלים',dist:'1.1 km',phone:false},
  {name:'בית כנסת תימני',k:'teimanim',addr:'הנביאים 9, ירושלים',dist:'1.5 km',phone:false},
];

/* ───────── screen renderers ───────── */
const restoCard=r=>{const t=TYPE[r.type],k=KASH[r.k];return `
  <div class="card"><div class="accent" style="background:${t.c}"></div><div class="cBody">
    <div class="cTop"><div class="ico" style="background:${hex(t.c,.09)}">${I.utensils(t.c)}</div>
      <div style="flex:1;min-width:0"><div class="cName">${r.name}</div><div class="cType" style="color:${t.c}">${t.l}</div></div>
      <div class="badge" style="background:${k.bg};color:${k.c}">${k.l}</div></div>
    <div class="meta"><div class="mRow">${I.pin}<div class="mTxt">${r.addr}</div></div>
      <div class="mRow">${I.clock}<div class="mTxt">${r.hours}</div></div></div>
    <div class="cBot"><div class="dist">${I.nav}<span>${r.dist}</span></div><div class="sp"></div>${I.chev}</div>
  </div></div>`;};

const globeP=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
const phoneG=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>`;
const synCard=s=>{const d=DENOM2[s.k];return `
  <div style="display:flex;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);font-family:'Inter',var(--sans)">
    <div style="width:4px;background:#7C3AED;flex:0 0 auto"></div>
    <div style="flex:1;padding:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="width:36px;height:36px;border-radius:10px;background:#F5F3FF;display:flex;align-items:center;justify-content:center;flex:0 0 auto">${globeP}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px;color:#111827">${s.name}</div>
          ${d?`<div style="display:inline-block;border-radius:8px;padding:3px 7px;margin-top:3px;background:${d.bg};color:${d.c};font-weight:600;font-size:11px">${d.l}</div>`:''}</div>
        <div style="display:flex;align-items:center;gap:3px;background:var(--goldFaint);border-radius:10px;padding:4px 7px;flex:0 0 auto">${I.nav}<span style="font-weight:700;font-size:11px;color:#D4AF37">${s.dist}</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">${I.pin}<div style="font-size:12px;color:#9CA3AF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.addr}</div></div>
      ${s.phone?`<div style="display:flex;gap:8px;margin-top:2px"><div style="display:flex;align-items:center;gap:5px;background:#F9FAFB;border:1px solid #F3F4F6;border-radius:10px;padding:6px 10px;font-size:12px;color:#6B7280;font-weight:500">${phoneG} Call</div></div>`:''}
    </div>
    <div style="display:flex;align-items:center;padding-right:14px">${I.chev}</div>
  </div>`;};

const SCREENS={
  login:()=>{
    const pin=(sz)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="rgba(100,149,255,0.32)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
    const mail=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>`;
    const lock=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;

      ${eyebrow('תמיכה')}
      ${card(`${row('rgba(11,23,54,.08)',ic(headset,'#0B1736'),'צור קשר')}${dv}${row('rgba(212,175,55,.12)',ic(info,'#D4AF37'),'אודות')}`)}
      <div style="margin:20px 16px 0;background:#fff;border:1.5px solid #FFCDD2;border-radius:16px;padding:16px;text-align:center;font-weight:700;font-size:15px;color:#D93025">התנתק</div>
      <div style="text-align:center;padding:14px;color:#BBC3D4;font-size:13px;text-decoration:underline">מחק חשבון</div>
    </div>`;},
};

const TABS=[['login','התחברות'],['home','בית'],['destination','דף יעד'],['restaurants','מסעדות'],['restaurant','דף מסעדה'],['synagogues','בתי כנסת'],['nearby','ליד אותך'],['saved','מועדפים'],['minyans','מניינים'],['hosting','אירוח'],['profile','פרופיל']];
const sw=document.getElementById('switcher'), sc=document.getElementById('screen');
const TAB_ICONS={
  home:c=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  compass:c=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`,
  nearby:c=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`,
  profile:c=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
};
function renderTab(active){
  const tb=document.getElementById('tabbar');
  const isTab=['home','nearby','profile'].includes(active);
  tb.style.display=isTab?'flex':'none';
  if(!isTab)return;
  const items=[['home','גלה'],['compass','כיוון תפילה'],['nearby','קרוב אליי'],['profile','פרופיל']];
  tb.innerHTML=items.map(([k,label])=>{const on=k===active;const col=on?'#0B1736':'#BBC3D4';const clk=(k==='home'||k==='nearby'||k==='profile')?`onclick="show('${k}')"`:'';return `<div ${clk} style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer">${TAB_ICONS[k](col)}<span style="font-size:10px;font-weight:600;color:${col};font-family:'Inter',var(--sans)">${label}</span></div>`;}).join('');
}
function show(key){sc.innerHTML=SCREENS[key]();[...sw.children].forEach(b=>b.classList.toggle('active',b.dataset.k===key));sc.scrollTop=0;renderTab(key);}
TABS.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.k=k;b.onclick=()=>show(k);sw.appendChild(b);});
show('home');

// ── Font switcher (live compare) ──
const FONTS=[['Inter','Inter (נוכחי)'],['Rubik','Rubik'],['Heebo','Heebo'],['Assistant','Assistant'],['"Frank Ruhl Libre"','Frank Ruhl (serif)']];
const fsw=document.getElementById('fontSwitcher'), fo=document.getElementById('fontOverride');
function setFont(f){ fo.textContent = (f==='Inter') ? '' : `.phone, .phone *{font-family:${f}, sans-serif !important}`; [...fsw.children].forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
FONTS.forEach(([f,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.f=f;b.onclick=()=>setFont(f);fsw.appendChild(b);});
setFont('Rubik');
</script>
